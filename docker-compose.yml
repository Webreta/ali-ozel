# Dev ortamı: sadece Postgres. Next.js host'ta `npm run dev` ile çalışır.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: aliozel
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: aliozel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
